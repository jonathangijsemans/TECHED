<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0a1f" />
<title>Cube Dash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a1f; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #hud {
    position: fixed; top: env(safe-area-inset-top, 12px); left: 0; right: 0;
    padding: 12px 18px; display: flex; justify-content: space-between;
    pointer-events: none; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,0,0,.7);
    font-size: clamp(14px, 4vw, 22px);
  }
  #hud span { background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 10px; }
  #muteBtn {
    position: fixed; top: env(safe-area-inset-top, 12px); left: 50%;
    transform: translateX(-50%); margin-top: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.15);
    font-size: 20px; cursor: pointer; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #muteBtn:active { transform: translateX(-50%) scale(.92); }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(20,10,40,.55), rgba(0,0,0,.85));
    text-align: center; transition: opacity .25s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: clamp(36px, 12vw, 84px);
    background: linear-gradient(90deg, #ff3df0, #00e6ff, #c4ff3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255,61,240,.35);
    letter-spacing: 4px;
  }
  #overlay p { font-size: clamp(14px, 4vw, 20px); opacity: .85; max-width: 28ch; line-height: 1.5; }
  #overlay button {
    margin-top: 6px;
    padding: 16px 36px; font-size: clamp(18px, 5vw, 24px); font-weight: 800;
    color: #0a0a1f; background: linear-gradient(135deg, #00e6ff, #c4ff3d);
    border: none; border-radius: 14px; cursor: pointer;
    box-shadow: 0 8px 30px rgba(0, 230, 255, .35), inset 0 -4px 0 rgba(0,0,0,.2);
    letter-spacing: 2px;
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 4px 18px rgba(0, 230, 255, .35), inset 0 -2px 0 rgba(0,0,0,.2); }
  .row { display: flex; gap: 14px; font-size: clamp(14px, 4vw, 18px); opacity: .9; }
  .row b { color: #c4ff3d; }
  .hint { font-size: clamp(12px, 3.5vw, 16px); opacity: .65; margin-top: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="score">0 m</span>
    <span id="best">Best 0 m</span>
  </div>
  <button id="muteBtn" aria-label="Toggle sound">&#x1F50A;</button>
  <div id="overlay">
    <h1>CUBE DASH</h1>
    <p>Tap to jump. Tap again in the air for a double jump. Avoid the spikes.</p>
    <div class="row"><span>Best: <b id="bestOverlay">0 m</b></span></div>
    <button id="playBtn">PLAY</button>
    <div class="hint">Hold to keep jumping when you land</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const bestOverlayEl = document.getElementById('bestOverlay');
  const muteBtn = document.getElementById('muteBtn');

  // ====== Audio engine (synthesized; no external assets) ======
  const Audio = (() => {
    let ac = null;
    let master = null, musicGain = null, sfxGain = null, sidechain = null;
    let delay = null, delayFb = null, delayWet = null;
    let muted = localStorage.getItem('cubedash_muted') === '1';
    let musicRunning = false;
    let schedulerTimer = null;
    let nextNoteTime = 0;
    let step = 0;                 // 16th-note counter
    const BPM = 142;
    const SIXTEENTH = 60 / BPM / 4;
    const LOOKAHEAD = 0.12;       // seconds
    const TICK_MS = 25;

    // Em - C - G - D progression. Notes are MIDI numbers.
    // For each bar (16 steps): bass root, triad notes for arp.
    const BARS = [
      { bass: 40, triad: [52, 55, 59] }, // Em: E2, [E4, G4, B4]
      { bass: 36, triad: [48, 52, 55] }, // C : C2, [C4, E4, G4]
      { bass: 43, triad: [55, 59, 62] }, // G : G2, [G4, B4, D5]
      { bass: 38, triad: [50, 54, 57] }, // D : D2, [D4, F#4, A4]
    ];
    // Arp pattern index into triad, per 16th step within a bar.
    const ARP = [0, 1, 2, 1, 2, 1, 0, 2, 0, 1, 2, 1, 2, 1, 0, 2];

    function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function ensure() {
      if (ac) return ac;
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(ac.destination);

      musicGain = ac.createGain();
      musicGain.gain.value = 0.55;
      musicGain.connect(master);

      sfxGain = ac.createGain();
      sfxGain.gain.value = 0.9;
      sfxGain.connect(master);

      // sidechain ducks the bass + lead on each kick
      sidechain = ac.createGain();
      sidechain.gain.value = 1;
      sidechain.connect(musicGain);

      // simple feedback delay used as "reverb" send for the lead
      delay = ac.createDelay(1.0);
      delay.delayTime.value = SIXTEENTH * 3; // dotted 8th-ish
      delayFb = ac.createGain();
      delayFb.gain.value = 0.32;
      delayWet = ac.createGain();
      delayWet.gain.value = 0.35;
      delay.connect(delayFb).connect(delay);
      delay.connect(delayWet).connect(sidechain);
      return ac;
    }

    function unlock() {
      const c = ensure();
      if (!c) return;
      if (c.state === 'suspended') c.resume();
    }

    function duckSidechain(t) {
      // pump-y envelope: drop to 0.35 then back to 1
      sidechain.gain.cancelScheduledValues(t);
      sidechain.gain.setValueAtTime(0.35, t);
      sidechain.gain.exponentialRampToValueAtTime(1.0, t + SIXTEENTH * 1.8);
    }

    function kick(t) {
      duckSidechain(t);
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(1.0, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g).connect(sidechain);
      o.start(t); o.stop(t + 0.25);

      // click
      const nb = noiseBuffer(0.03);
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
      const ng = ac.createGain(); ng.gain.setValueAtTime(0.4, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      ns.connect(hp).connect(ng).connect(sidechain);
      ns.start(t);
    }

    function snare(t) {
      const nb = noiseBuffer(0.2);
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.7;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.55, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      ns.connect(bp).connect(g).connect(sidechain);
      ns.start(t); ns.stop(t + 0.2);
    }

    function hat(t, open) {
      const nb = noiseBuffer(open ? 0.12 : 0.04);
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
      const g = ac.createGain();
      const peak = open ? 0.18 : 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (open ? 0.12 : 0.04));
      ns.connect(hp).connect(g).connect(sidechain);
      ns.start(t); ns.stop(t + 0.15);
    }

    function bass(t, midi) {
      const dur = SIXTEENTH * 3.7;
      const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = mtof(midi);
      const o2 = ac.createOscillator(); o2.type = 'square';   o2.frequency.value = mtof(midi);
      o2.detune.value = -8;
      const f = ac.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(220, t + dur);
      f.Q.value = 6;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.55, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o1.connect(f); o2.connect(f); f.connect(g).connect(sidechain);
      o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
    }

    function lead(t, midi) {
      const dur = SIXTEENTH * 1.8;
      const o1 = ac.createOscillator(); o1.type = 'square';   o1.frequency.value = mtof(midi);
      const o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = mtof(midi + 12);
      o2.detune.value = 6;
      const f = ac.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(4500, t);
      f.frequency.exponentialRampToValueAtTime(1200, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o1.connect(f); o2.connect(f); f.connect(g);
      g.connect(sidechain);
      g.connect(delay);
      o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
    }

    let _noiseCache = null;
    function noiseBuffer(seconds) {
      const len = Math.floor(ac.sampleRate * seconds);
      if (_noiseCache && _noiseCache.length >= len) {
        // reuse a larger buffer by creating a slice-like buffer
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        buf.copyToChannel(_noiseCache.getChannelData(0).subarray(0, len), 0);
        return buf;
      }
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      _noiseCache = buf;
      return buf;
    }

    function scheduleStep(s, t) {
      const bar = Math.floor(s / 16) % BARS.length;
      const local = s % 16;
      const b = BARS[bar];

      // Kick on 1, 5, 9, 13 (every quarter)
      if (local % 4 === 0) kick(t);
      // Snare on 5, 13
      if (local === 4 || local === 12) snare(t);
      // Hi-hat: closed on every 8th, open on the "&" of beat 4
      if (local % 2 === 0) hat(t, false);
      else if (local === 15) hat(t, true);

      // Bass: on each quarter, root note; occasional octave at &4
      if (local % 4 === 0) bass(t, b.bass);
      if (local === 14) bass(t, b.bass + 12);

      // Lead arp every 16th
      const note = b.triad[ARP[local]];
      // accent: louder feel via slight chord top every beat
      lead(t, note + (local % 8 === 6 ? 12 : 0));
    }

    function tickScheduler() {
      if (!ac || !musicRunning) return;
      while (nextNoteTime < ac.currentTime + LOOKAHEAD) {
        scheduleStep(step, nextNoteTime);
        nextNoteTime += SIXTEENTH;
        step = (step + 1) % (16 * BARS.length);
      }
    }

    function startMusic() {
      const c = ensure();
      if (!c) return;
      if (c.state === 'suspended') c.resume();
      if (musicRunning) return;
      musicRunning = true;
      step = 0;
      nextNoteTime = ac.currentTime + 0.05;
      // fade in
      musicGain.gain.cancelScheduledValues(ac.currentTime);
      musicGain.gain.setValueAtTime(0.0001, ac.currentTime);
      musicGain.gain.exponentialRampToValueAtTime(0.55, ac.currentTime + 0.4);
      schedulerTimer = setInterval(tickScheduler, TICK_MS);
    }

    function stopMusic(fade = 0.6) {
      if (!ac || !musicRunning) return;
      const t = ac.currentTime;
      musicGain.gain.cancelScheduledValues(t);
      musicGain.gain.setValueAtTime(musicGain.gain.value, t);
      musicGain.gain.exponentialRampToValueAtTime(0.0001, t + fade);
      setTimeout(() => {
        musicRunning = false;
        if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
      }, fade * 1000 + 50);
    }

    function playJump(air) {
      const c = ensure(); if (!c) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = air ? 'sawtooth' : 'square';
      const g = ac.createGain();
      const startF = air ? 700 : 420;
      const endF   = air ? 1500 : 960;
      o.frequency.setValueAtTime(startF, t);
      o.frequency.exponentialRampToValueAtTime(endF, t + (air ? 0.07 : 0.09));
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(air ? 0.28 : 0.35, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + (air ? 0.16 : 0.12));
      o.connect(g);
      g.connect(sfxGain);
      if (air) g.connect(delay); // give the air jump a little tail
      o.start(t); o.stop(t + 0.2);
    }

    function playLand() {
      const c = ensure(); if (!c) return;
      const t = ac.currentTime;
      const nb = noiseBuffer(0.08);
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      ns.connect(lp).connect(g).connect(sfxGain);
      ns.start(t); ns.stop(t + 0.1);
    }

    function playDeath() {
      const c = ensure(); if (!c) return;
      const t = ac.currentTime;
      // descending sweep
      const o = ac.createOscillator(); o.type = 'sawtooth';
      const g = ac.createGain();
      o.frequency.setValueAtTime(620, t);
      o.frequency.exponentialRampToValueAtTime(80, t + 0.5);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.connect(g).connect(sfxGain);
      o.start(t); o.stop(t + 0.6);
      // noise burst
      const nb = noiseBuffer(0.35);
      const ns = ac.createBufferSource(); ns.buffer = nb;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.6;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0.4, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      ns.connect(bp).connect(ng).connect(sfxGain);
      ns.start(t); ns.stop(t + 0.4);
    }

    function isMuted() { return muted; }
    function setMuted(v) {
      muted = !!v;
      localStorage.setItem('cubedash_muted', muted ? '1' : '0');
      if (master) {
        const t = ac.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, t + 0.08);
      }
    }
    function toggleMuted() { setMuted(!muted); return muted; }

    return { unlock, startMusic, stopMusic, playJump, playLand, playDeath, isMuted, toggleMuted };
  })();

  function updateMuteIcon() {
    muteBtn.innerHTML = Audio.isMuted() ? '&#x1F507;' : '&#x1F50A;';
  }
  updateMuteIcon();
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    Audio.unlock();
    Audio.toggleMuted();
    updateMuteIcon();
  });
  muteBtn.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });

  let DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let W = 0, H = 0;          // CSS pixels
  let groundY = 0;
  let unit = 40;             // size of one tile in CSS px
  const SPEED = 380;         // px/sec horizontal
  const GRAV = 2400;         // px/sec^2
  const JUMP_V = -880;       // px/sec

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    W = w; H = h;
    canvas.width = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    unit = Math.max(28, Math.min(56, Math.round(Math.min(w, h) / 12)));
    groundY = H - Math.max(80, H * 0.18);
  }
  window.addEventListener('resize', resize);
  resize();

  const player = {
    x: 0, y: 0, size: 0,
    vy: 0, onGround: true, rot: 0,
    alive: true, holding: false,
    jumpsUsed: 0, maxJumps: 2,
    trail: [],
  };

  let camX = 0;
  let obstacles = []; // {type:'spike'|'block', x, y, w, h}
  let nextSpawn = 0;
  let score = 0, best = +localStorage.getItem('cubedash_best') || 0;
  let running = false;
  let lastT = 0;
  let particles = [];
  let shake = 0;
  let bgHueShift = 0;

  bestEl.textContent = `Best ${best} m`;
  bestOverlayEl.textContent = `${best} m`;

  function reset() {
    player.size = unit;
    player.x = W * 0.22;
    player.y = groundY - player.size;
    player.vy = 0;
    player.onGround = true;
    player.rot = 0;
    player.alive = true;
    player.jumpsUsed = 0;
    player.trail.length = 0;
    camX = 0;
    obstacles.length = 0;
    particles.length = 0;
    nextSpawn = W * 0.9;
    score = 0;
    shake = 0;
    lastT = 0;
  }

  function spawnPattern(startX) {
    const r = Math.random();
    const u = unit;
    if (r < 0.32) {
      obstacles.push({ type: 'spike', x: startX, y: groundY - u, w: u, h: u });
    } else if (r < 0.55) {
      obstacles.push({ type: 'spike', x: startX, y: groundY - u, w: u, h: u });
      obstacles.push({ type: 'spike', x: startX + u, y: groundY - u, w: u, h: u });
    } else if (r < 0.75) {
      const h = u * 2;
      obstacles.push({ type: 'block', x: startX, y: groundY - h, w: u * 2, h: h });
      if (Math.random() < 0.55) {
        obstacles.push({ type: 'spike', x: startX + u * 3.2, y: groundY - u, w: u, h: u });
      }
    } else if (r < 0.9) {
      obstacles.push({ type: 'block', x: startX, y: groundY - u, w: u, h: u });
      obstacles.push({ type: 'block', x: startX + u, y: groundY - u * 2, w: u, h: u });
      obstacles.push({ type: 'spike', x: startX + u * 2.6, y: groundY - u, w: u, h: u });
    } else {
      obstacles.push({ type: 'spike', x: startX, y: groundY - u, w: u, h: u });
      obstacles.push({ type: 'spike', x: startX + u * 1.1, y: groundY - u, w: u, h: u });
      obstacles.push({ type: 'spike', x: startX + u * 2.2, y: groundY - u, w: u, h: u });
    }
    const w = lastSpawnedRight();
    nextSpawn = w + u * (2.6 + Math.random() * 2.4);
  }

  function lastSpawnedRight() {
    let m = 0;
    for (const o of obstacles) m = Math.max(m, o.x + o.w);
    return m;
  }

  function tryJump() {
    if (!player.alive) return;
    if (player.jumpsUsed >= player.maxJumps) return;
    const isAirJump = !player.onGround;
    player.vy = JUMP_V * (isAirJump ? 0.92 : 1);
    player.onGround = false;
    player.jumpsUsed++;
    Audio.playJump(isAirJump);
    const burst = isAirJump ? 14 : 6;
    for (let i = 0; i < burst; i++) {
      const angle = isAirJump
        ? (i / burst) * Math.PI * 2
        : -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
      const speed = isAirJump ? 220 : 140;
      particles.push({
        x: player.x + player.size / 2,
        y: player.y + (isAirJump ? player.size / 2 : player.size),
        vx: Math.cos(angle) * speed * (0.6 + Math.random() * 0.6),
        vy: Math.sin(angle) * speed * (0.6 + Math.random() * 0.6) - (isAirJump ? 0 : 40),
        life: 0.35 + Math.random() * 0.3,
        age: 0,
        c: isAirJump ? '#00e6ff' : '#c4ff3d',
      });
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function pointInTriangle(px, py, x1, y1, x2, y2, x3, y3) {
    const d = ((y2 - y3) * (x1 - x3) + (x3 - x2) * (y1 - y3));
    const a = ((y2 - y3) * (px - x3) + (x3 - x2) * (py - y3)) / d;
    const b = ((y3 - y1) * (px - x3) + (x1 - x3) * (py - y3)) / d;
    const c = 1 - a - b;
    return a >= 0 && b >= 0 && c >= 0;
  }

  function rectVsSpike(rect, spike) {
    // spike triangle: apex top-center, base on ground line of the spike rect
    const apex = { x: spike.x + spike.w / 2, y: spike.y + 6 };
    const bl = { x: spike.x + 4, y: spike.y + spike.h };
    const br = { x: spike.x + spike.w - 4, y: spike.y + spike.h };
    // Inflate triangle a bit by checking rect corners only
    const corners = [
      { x: rect.x, y: rect.y },
      { x: rect.x + rect.w, y: rect.y },
      { x: rect.x, y: rect.y + rect.h },
      { x: rect.x + rect.w, y: rect.y + rect.h },
      { x: rect.x + rect.w / 2, y: rect.y + rect.h * 0.85 },
    ];
    for (const c of corners) {
      if (pointInTriangle(c.x, c.y, apex.x, apex.y, bl.x, bl.y, br.x, br.y)) return true;
    }
    return false;
  }

  function die() {
    if (!player.alive) return;
    player.alive = false;
    shake = 18;
    Audio.playDeath();
    Audio.stopMusic(0.5);
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: player.x + player.size / 2,
        y: player.y + player.size / 2,
        vx: (Math.random() - 0.5) * 600,
        vy: (Math.random() - 0.5) * 600,
        life: 0.6 + Math.random() * 0.4,
        age: 0,
        c: i % 2 ? '#ff3df0' : '#ffd23d',
      });
    }
    if (score > best) {
      best = score;
      localStorage.setItem('cubedash_best', String(best));
    }
    bestEl.textContent = `Best ${best} m`;
    bestOverlayEl.textContent = `${best} m`;
    setTimeout(() => {
      overlay.classList.remove('hidden');
      running = false;
    }, 700);
  }

  function update(dt) {
    if (!player.alive) {
      camX += SPEED * dt * 0.3;
      updateParticles(dt);
      shake *= 0.9;
      return;
    }

    // Horizontal world scroll
    camX += SPEED * dt;
    score = Math.floor(camX / unit);
    scoreEl.textContent = `${score} m`;

    // Gravity / vertical
    player.vy += GRAV * dt;
    if (player.holding && player.onGround) tryJump();
    player.y += player.vy * dt;

    // Default to airborne; ground/blocks re-set onGround
    let landed = false;

    // Ground collision
    if (player.y + player.size >= groundY) {
      player.y = groundY - player.size;
      player.vy = 0;
      landed = true;
    }

    // Spawn obstacles ahead
    while (nextSpawn - camX < W + 200) {
      spawnPattern(nextSpawn);
    }

    // Cull obstacles behind camera
    obstacles = obstacles.filter(o => o.x + o.w - camX > -200);

    // Collision with obstacles
    const playerRect = { x: player.x, y: player.y, w: player.size, h: player.size };
    for (const o of obstacles) {
      const screenX = o.x - camX;
      const ob = { x: screenX, y: o.y, w: o.w, h: o.h };
      if (o.type === 'spike') {
        if (rectsOverlap(playerRect, ob) && rectVsSpike(playerRect, ob)) {
          die();
          return;
        }
      } else {
        if (rectsOverlap(playerRect, ob)) {
          // Block: side hit -> die, top -> land
          const prevBottom = player.y + player.size - player.vy * dt;
          if (player.vy >= 0 && prevBottom <= o.y + 2) {
            // Land on top
            player.y = o.y - player.size;
            player.vy = 0;
            landed = true;
          } else {
            die();
            return;
          }
        }
      }
    }

    if (landed && !player.onGround && player.vy === 0) {
      // landed from a jump this frame
      Audio.playLand();
    }
    if (landed) player.jumpsUsed = 0;
    player.onGround = landed;
    if (landed) {
      // snap rotation to multiples of 90deg quickly
      const target = Math.round(player.rot / (Math.PI / 2)) * (Math.PI / 2);
      player.rot += (target - player.rot) * Math.min(1, dt * 18);
    } else {
      player.rot += dt * 7.5;
    }

    // Trail
    player.trail.push({ x: player.x + player.size / 2, y: player.y + player.size / 2, age: 0 });
    if (player.trail.length > 18) player.trail.shift();
    for (const t of player.trail) t.age += dt;

    updateParticles(dt);
    shake *= 0.88;
    bgHueShift = (bgHueShift + dt * 8) % 360;
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.age += dt;
      p.vy += 600 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    particles = particles.filter(p => p.age < p.life);
  }

  function drawBackground() {
    // sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${260 + Math.sin(bgHueShift * 0.02) * 20}, 70%, 12%)`);
    g.addColorStop(0.55, `hsl(${280 + Math.sin(bgHueShift * 0.02) * 20}, 70%, 8%)`);
    g.addColorStop(1, '#05050f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // distant mountains (parallax)
    const px = -((camX * 0.15) % (W));
    ctx.fillStyle = 'rgba(120, 60, 200, 0.35)';
    for (let i = -1; i < 3; i++) {
      const baseX = px + i * W;
      ctx.beginPath();
      ctx.moveTo(baseX, groundY);
      let x = baseX;
      while (x < baseX + W) {
        const peak = (Math.sin(x * 0.01 + i) + 1) * 0.5;
        ctx.lineTo(x, groundY - 60 - peak * 120);
        x += 80;
      }
      ctx.lineTo(baseX + W, groundY);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(60, 30, 120, 0.55)';
    const px2 = -((camX * 0.3) % (W));
    for (let i = -1; i < 3; i++) {
      const baseX = px2 + i * W;
      ctx.beginPath();
      ctx.moveTo(baseX, groundY);
      let x = baseX;
      while (x < baseX + W) {
        const peak = (Math.cos(x * 0.012 + i * 1.7) + 1) * 0.5;
        ctx.lineTo(x, groundY - 30 - peak * 80);
        x += 60;
      }
      ctx.lineTo(baseX + W, groundY);
      ctx.closePath();
      ctx.fill();
    }

    // ground grid
    ctx.fillStyle = '#101025';
    ctx.fillRect(0, groundY, W, H - groundY);

    // ground top line
    ctx.strokeStyle = '#00e6ff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00e6ff';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // vertical grid lines moving with camera
    ctx.strokeStyle = 'rgba(0, 230, 255, 0.12)';
    ctx.lineWidth = 1;
    const step = unit;
    const offset = -((camX) % step);
    for (let x = offset; x < W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = groundY + step; y < H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const x = o.x - camX;
      if (x + o.w < -40 || x > W + 40) continue;
      if (o.type === 'spike') {
        // triangle
        ctx.fillStyle = '#ff3df0';
        ctx.shadowColor = '#ff3df0';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(x + o.w / 2, o.y);
        ctx.lineTo(x + o.w, o.y + o.h);
        ctx.lineTo(x, o.y + o.h);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        // inner highlight
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.moveTo(x + o.w / 2, o.y + 4);
        ctx.lineTo(x + o.w * 0.7, o.y + o.h - 4);
        ctx.lineTo(x + o.w * 0.3, o.y + o.h - 4);
        ctx.closePath();
        ctx.fill();
      } else {
        // block
        ctx.fillStyle = '#00e6ff';
        ctx.shadowColor = '#00e6ff';
        ctx.shadowBlur = 14;
        ctx.fillRect(x, o.y, o.w, o.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(x + 4, o.y + 4, o.w - 8, 6);
        ctx.strokeStyle = '#082b33';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, o.y + 1, o.w - 2, o.h - 2);
      }
    }
  }

  function drawPlayer() {
    // trail
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      const a = 1 - t.age / 0.35;
      if (a <= 0) continue;
      const s = player.size * (0.4 + i / player.trail.length * 0.5);
      ctx.fillStyle = `rgba(196, 255, 61, ${a * 0.35})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, s * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!player.alive) return;

    const cx = player.x + player.size / 2;
    const cy = player.y + player.size / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.rot);
    const s = player.size;
    // glow
    ctx.shadowColor = '#c4ff3d';
    ctx.shadowBlur = 22;
    // body gradient
    const grad = ctx.createLinearGradient(-s/2, -s/2, s/2, s/2);
    grad.addColorStop(0, '#c4ff3d');
    grad.addColorStop(1, '#00e6ff');
    ctx.fillStyle = grad;
    ctx.fillRect(-s/2, -s/2, s, s);
    ctx.shadowBlur = 0;
    // inner square
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-s/2 + 6, -s/2 + 6, s - 12, s - 12);
    // eye
    ctx.fillStyle = '#fff';
    ctx.fillRect(-s/2 + 10, -s/2 + 10, s/4, s/4);
    ctx.fillStyle = '#0a0a1f';
    ctx.fillRect(-s/2 + 14, -s/2 + 14, s/8, s/8);
    // border
    ctx.strokeStyle = '#0a0a1f';
    ctx.lineWidth = 3;
    ctx.strokeRect(-s/2, -s/2, s, s);
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
  }

  function frame(t) {
    if (!running) return;
    if (!lastT) lastT = t;
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;

    update(dt);

    // shake
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;
    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();
    drawObstacles();
    drawPlayer();
    drawParticles();
    ctx.restore();

    requestAnimationFrame(frame);
  }

  function start() {
    resize();
    reset();
    overlay.classList.add('hidden');
    running = true;
    lastT = 0;
    Audio.unlock();
    Audio.startMusic();
    requestAnimationFrame(frame);
  }

  // input
  function onDown(e) {
    if (e.cancelable) e.preventDefault();
    if (!running) { start(); return; }
    player.holding = true;
    tryJump();
  }
  function onUp(e) {
    if (e.cancelable) e.preventDefault();
    player.holding = false;
  }
  window.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchend', onUp, { passive: false });
  window.addEventListener('mousedown', onDown);
  window.addEventListener('mouseup', onUp);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (e.repeat) return;
      onDown(e);
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') onUp(e);
  });
  playBtn.addEventListener('click', e => { e.stopPropagation(); start(); });
  playBtn.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });

  // Prevent iOS double-tap zoom and pinch
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  // draw idle frame
  resize();
  reset();
  drawBackground();
  drawPlayer();
})();
</script>
</body>
</html>
